version: "3.8"

services:
  php:
    build:
      context: ./docker/php
    container_name: matchio-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      SYMFONY_ENV: dev
    ports:
      - "9001:9000"

  nginx:
    image: nginx:latest
    container_name: matchio-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
